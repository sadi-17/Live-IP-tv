include ':app'

def localPropertiesFile = new File(rootDir, 'local.properties')
def properties = new Properties()

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> properties.load(reader) }
}

def flutterSdkPath = properties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    throw new GradleException('Flutter SDK not found. Define location with flutter.sdk in the local.properties file.')
}

def flutterRoot = file(flutterSdkPath)

gradle.ext.flutterRoot = flutterRoot.absolutePath
gradle.ext.flutterEngineVersion = file(new File(flutterRoot, 'bin/internal/engine.version')).text.strip()

gradle.ext.androidxVersion = '1.1.1'
gradle.ext.androidxTestVersion = '1.5.0'
gradle.ext.androidGradlePluginVersion = '7.3.0'
